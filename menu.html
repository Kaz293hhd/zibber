<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мәзір - Dәмді Kafe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo"><i class="fa-solid fa-utensils"></i> Dәмді<span>Kafe</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Басты бет</a></li>
                <li><a href="menu.html" class="active">Мәзір</a></li>
                <li><a href="about.html">Біз туралы</a></li>
                <li><a href="contact.html">Байланыс</a></li>
                <li><a href="admin.html" style="color: #ee5253;"><i class="fa-solid fa-user-shield"></i> Админ</a></li>
            </ul>
            <div class="cart-icon-btn" id="cart-btn">
                <i class="fa-solid fa-basket-shopping"></i>
                <span class="cart-count" id="cart-count">0</span>
            </div>
        </nav>
    </header>

    <main class="page-content">
        <h2 class="section-title">Біздің Мәзір</h2>
        <p class="section-subtitle">Өзіңізге ұнайтын сүйікті тағамды таңдаңыз</p>

        <div class="filter-buttons">
            <button class="filter-btn active" data-category="all">Барлығы</button>
            <button class="filter-btn" data-category="burgers">Бургерлер</button>
            <button class="filter-btn" data-category="pizza">Пиццалар</button>
            <button class="filter-btn" data-category="drinks">Сусындар</button>
        </div>

        <div class="menu-grid" id="menu-grid"></div>
    </main>

    <!-- Cart Modal -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <span class="close-modal" id="close-cart">&times;</span>
            <h2><i class="fa-solid fa-cart-shopping"></i> Тапсырысты рәсімдеу</h2>
            <div id="cart-items" style="margin-top:20px;"></div>
            <div class="cart-total">Барлығы: <span id="cart-total">0 ₸</span></div>
            
            <div class="form-group">
                <input type="text" id="checkout-name" placeholder="Аты-жөніңіз *" required>
            </div>
            <div class="form-group">
                <input type="tel" id="checkout-phone" placeholder="Телефон нөміріңіз *" required>
            </div>
            <div class="form-group">
                <input type="text" id="checkout-address" placeholder="Жеткізу мекенжайы *" required>
            </div>
            <div class="form-group">
                <label><strong>Төлем тәсілі:</strong></label>
                <select id="checkout-payment" style="margin-top:5px;">
                    <option value="Қолма-қол (Cash)">💵 Қолма-қол ақшамен (Курьерге)</option>
                    <option value="Банк картасы / Kaspi QR">💳 Банк картасы / Kaspi QR</option>
                </select>
            </div>

            <button class="btn btn-secondary" style="width:100%;" onclick="checkout()">Тапсырыс беру</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Dәмді Kafe. Барлық құқықтар қорғалған.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
