<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Байланыс және тапсырыс - Dәмді Kafe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo"><i class="fa-solid fa-utensils"></i> Dәмді<span>Kafe</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Басты бет</a></li>
                <li><a href="menu.html">Мәзір</a></li>
                <li><a href="about.html">Біз туралы</a></li>
                <li><a href="contact.html" class="active">Байланыс</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-content">
        <h2>Бізбен байланысу & Тапсырыс беру</h2>
        <div class="contact-container">
            <form id="contact-form">
                <div class="form-group">
                    <label for="name"><i class="fa-solid fa-user"></i> Аты-жөніңіз</label>
                    <input type="text" id="name" placeholder="Мысалы: Айбек" required>
                </div>
                <div class="form-group">
                    <label for="phone"><i class="fa-solid fa-phone"></i> Телефон номеріңіз</label>
                    <input type="tel" id="phone" placeholder="+7 (700) 000-00-00" required>
                </div>
                <div class="form-group">
                    <label for="message"><i class="fa-solid fa-comment"></i> Тапсырыс немесе хабарлама</label>
                    <textarea id="message" placeholder="Қандай тағамға тапсырыс бергіңіз келеді?" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn">Тапсырысты жіберу</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Dәмді Kafe. Барлық құқықтар қорғалған.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
