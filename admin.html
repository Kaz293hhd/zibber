<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панелі - Dәмді Kafe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo"><i class="fa-solid fa-utensils"></i> Dәмді<span>Kafe</span> (Admin)</a>
            <ul class="nav-links">
                <li><a href="index.html">Басты бет</a></li>
                <li id="logout-btn-container" style="display:none;">
                    <button class="btn btn-danger" onclick="logoutAdmin()">Шығу</button>
                </li>
            </ul>
        </nav>
    </header>

    <main class="page-content">
        <!-- АВТОРИЗАЦИЯ ФОРМАСЫ -->
        <div id="login-section" class="form-container">
            <h2 style="text-align: center; margin-bottom: 20px;"><i class="fa-solid fa-lock"></i> Админге кіру</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="admin-user" placeholder="admin" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="admin-pass" placeholder="12345" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Кіру</button>
            </form>
        </div>

        <!-- АДМИН ПАНЕЛЬ -->
        <div id="admin-dashboard" style="display: none;">
            <h2 class="section-title"><i class="fa-solid fa-user-gear"></i> Әкімші Басқару Панелі</h2>

            <div class="admin-grid">
                <div>
                    <h3>Жаңа тағам қосу</h3>
                    <div class="form-container" style="margin-top: 15px;">
                        <form id="add-item-form">
                            <div class="form-group">
                                <label>Тағам атауы</label>
                                <input type="text" id="add-title" required>
                            </div>
                            <div class="form-group">
                                <label>Санаты</label>
                                <select id="add-category">
                                    <option value="burgers">Бургерлер</option>
                                    <option value="pizza">Пиццалар</option>
                                    <option value="drinks">Сусындар</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Бағасы (₸)</label>
                                <input type="number" id="add-price" required>
                            </div>
                            <div class="form-group">
                                <label>Сурет таңдаңыз (Файл)</label>
                                <input type="file" id="add-file" accept="image/*" required>
                            </div>
                            <div class="form-group">
                                <label>Сипаттамасы</label>
                                <textarea id="add-desc" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-secondary" style="width: 100%;">Сақтау</button>
                        </form>
                    </div>
                </div>

                <div>
                    <h3>Мәзірдегі тағамдар</h3>
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Сурет</th>
                                <th>Атауы</th>
                                <th>Бағасы</th>
                                <th>Әрекет</th>
                            </tr>
                        </thead>
                        <tbody id="admin-menu-table"></tbody>
                    </table>

                    <h3 style="margin-top: 30px;"><i class="fa-solid fa-list-check"></i> Келіп түскен тапсырыстар</h3>
                    <div id="orders-container"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Dәмді Kafe. Басқару жүйесі.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;

            if (user === 'admin' && pass === '12345') {
                localStorage.setItem('isAdminLogged', 'true');
                checkAuth();
            } else {
                alert('Логин немесе пароль қате!');
            }
        });

        function checkAuth() {
            const isLogged = localStorage.getItem('isAdminLogged') === 'true';
            if (isLogged) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                document.getElementById('logout-btn-container').style.display = 'block';
                loadAdminData();
            } else {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('admin-dashboard').style.display = 'none';
                document.getElementById('logout-btn-container').style.display = 'none';
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('isAdminLogged');
            checkAuth();
        }

        function loadAdminData() {
            const items = getMenuItems();
            const menuTable = document.getElementById('admin-menu-table');
            menuTable.innerHTML = '';
            
            items.forEach(item => {
                menuTable.innerHTML += `
                    <tr>
                        <td><img src="${item.img}" style="width:50px; height:50px; object-fit:cover; border-radius:8px;"></td>
                        <td>${item.title}</td>
                        <td>${item.price} ₸</td>
                        <td>
                            <button class="btn btn-danger" style="padding: 4px 8px; font-size:0.8rem;" onclick="deleteMenuItem(${item.id})">Өшіру</button>
                        </td>
                    </tr>
                `;
            });

            const orders = getOrders();
            const ordersDiv = document.getElementById('orders-container');
            ordersDiv.innerHTML = '';

            if (orders.length === 0) {
                ordersDiv.innerHTML = '<p style="margin-top:10px;">Әзірше тапсырыстар жоқ.</p>';
            } else {
                orders.reverse().forEach(ord => {
                    let itemsList = ord.items.map(i => `${i.title} x${i.quantity}`).join(', ');
                    ordersDiv.innerHTML += `
                        <div style="background:white; padding:15px; border-radius:10px; box-shadow:var(--shadow); margin-top:10px;">
                            <strong>№${ord.id} (${ord.date})</strong><br>
                            <strong>Клиент:</strong> ${ord.customer} (${ord.phone})<br>
                            <strong>Мекенжай:</strong> ${ord.address}<br>
                            <strong>Төлем тәсілі:</strong> <span style="color:var(--secondary); font-weight:bold;">${ord.payment}</span><br>
                            <strong>Тапсырыс:</strong> ${itemsList}<br>
                            <strong style="color:var(--primary)">Сомасы: ${ord.total} ₸</strong>
                        </div>
                    `;
                });
            }
        }

        function deleteMenuItem(id) {
            let items = getMenuItems();
            items = items.filter(i => i.id !== id);
            saveMenuItems(items);
            loadAdminData();
        }

        document.getElementById('add-item-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('add-file');
            const file = fileInput.files[0];

            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const imgBase64 = evt.target.result;
                const items = getMenuItems();

                const newItem = {
                    id: Date.now(),
                    title: document.getElementById('add-title').value,
                    category: document.getElementById('add-category').value,
                    price: Number(document.getElementById('add-price').value),
                    img: imgBase64,
                    desc: document.getElementById('add-desc').value
                };

                items.push(newItem);
                saveMenuItems(items);
                document.getElementById('add-item-form').reset();
                loadAdminData();
                alert('Тағам сәтті қосылды!');
            };

            reader.readAsDataURL(file);
        });

        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
